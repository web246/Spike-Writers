<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="google-site-verification" content="oGrGdaVJcJlIf3UBFDAkUccRJT3hrdd592WGs6c6fSI" />
  <meta name="description" content="SpikeWriters — Hire verified writers for essays, blog posts, marketing copy and more. Fast turnaround, secure payments, and quality-checked talent." />
  <meta name="keywords" content="SpikeWriters, writers for hire, freelance writers, essay writers, blog writers, copywriting, content writing, verified writers, hire writers, writing services" />
  <link rel="canonical" href="/" />
  <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
  <meta property="og:title" content="SpikeWriters — Find trusted writers, fast" />
  <meta property="og:description" content="Hire verified writers for essays, marketing copy, blog posts and more. Secure payments and on-time delivery." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="/" />
  <meta property="og:site_name" content="SpikeWriters" />

  <link rel="stylesheet" href="styles.css">
  <title>Admin — Writers</title>
</head>
<body>
  <div id="site-header"></div>
  <main class="container">
    <h1>Writers</h1>
    <div style="margin-bottom:1rem">
      <button id="btnRefresh" class="btn">Refresh</button>
      <button id="btnEmailSelected" class="btn btn-primary">Email Selected</button>
      <button id="btnEmailAll" class="btn">Email All</button>
    </div>
    <table class="table" id="writersTable">
      <thead><tr><th><input id="checkAllW" type="checkbox"></th><th>Date Joined</th><th>Name</th><th>Email</th><th>Phone</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>
  </main>
  <div id="site-footer"></div>
  <script src="assets/includes-loader.js"></script>
  <script src="assets/db.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', function(){
    var table = document.querySelector('#writersTable tbody');
    var allCheckbox = document.getElementById('checkAllW');
    function load(){
      window._DB.ready.then(function(){
        window._DB.getUsers().then(function(users){
          var writers = users.filter(u=>u.role==='writer');
          table.innerHTML='';
          writers.forEach(function(w){
            var tr=document.createElement('tr');
            tr.innerHTML = '<td><input class="sel" data-email="'+(w.email||'')+'" type="checkbox" data-id="'+w.id+'"></td>'
              +'<td>'+(w.joined_at||'')+'</td>'
              +'<td>'+(w.name||'')+'</td>'
              +'<td>'+(w.email||'')+'</td>'
              +'<td>'+(w.phone||'')+'</td>'
              +'<td>'+(w.active? 'Active':'Inactive')+'</td>'
              +'<td><button class="btn small view" data-id="'+w.id+'">View</button> <button class="btn small msg" data-id="'+w.id+'">Message</button></td>';
            table.appendChild(tr);
          });
        });
      });
    }
    document.getElementById('btnRefresh').addEventListener('click', load);
    document.getElementById('btnEmailAll').addEventListener('click', function(){
      window._DB.getUsers().then(function(users){ var emails = users.filter(u=>u.role==='writer').map(u=>u.email).filter(Boolean); if(!emails.length) return alert('No writer emails'); window.location.href = 'mailto:'+emails.join(','); });
    });
    document.getElementById('btnEmailSelected').addEventListener('click', function(){ var sels = Array.from(document.querySelectorAll('.sel:checked')).map(function(i){ return i.dataset.email; }).filter(Boolean); if(!sels.length) return alert('Select some writers'); window.location.href = 'mailto:'+sels.join(','); });
    allCheckbox.addEventListener('change', function(){ document.querySelectorAll('.sel').forEach(function(cb){ cb.checked = allCheckbox.checked; }); });
    table.addEventListener('click', function(ev){ if(ev.target.matches('.view')){ var id = ev.target.dataset.id; location.href = 'admin_writer_view.html?id='+id; } if(ev.target.matches('.msg')){ var id=ev.target.dataset.id; var subject = encodeURIComponent('Message from SpikeWriters Admin'); var body = encodeURIComponent(''); window.location.href = 'mailto:'+ev.target.closest('tr').querySelector('td:nth-child(4)').textContent+'?subject='+subject+'&body='+body; } });
    load();
  });
  </script>
</body>
</html>
